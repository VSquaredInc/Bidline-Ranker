name: Monthly Bid File Review

# SCHEDULE DISABLED (September 2026). Atlas moved the bid package library to
# SharePoint Online behind Duo MFA + Conditional Access, so no unattended job
# can sign in any more — the portal-fetch endpoint this review used was retired
# in v1.12.0 and now answers 410. The monthly review is done locally instead:
#
#   cd tools
#   node portal-download.js         # opens a browser; you complete the Duo login once
#   node portal-review.js --local out/portal-download/<BASE>-<AIRCRAFT>-<POS>
#
# Kept as workflow_dispatch only so the job definition survives for when/if an
# unattended path (e.g. a company-approved Graph API app) becomes available.
#
# Privacy: the repo is public, so this job uploads ONLY the non-sensitive review
# summary. The parsed bid dataset is NOT uploaded (it would be publicly
# downloadable).

on:
  workflow_dispatch: {}       # manual runs only — see note above

permissions:
  contents: read

concurrency:
  group: monthly-bid-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install reviewer dependencies
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Run portal review
        id: review
        working-directory: tools
        env:
          ATLAS_USERNAME: ${{ secrets.ATLAS_USERNAME }}
          ATLAS_PASSWORD: ${{ secrets.ATLAS_PASSWORD }}
        run: |
          if [ -z "$ATLAS_USERNAME" ] || [ -z "$ATLAS_PASSWORD" ]; then
            echo "::warning::ATLAS_USERNAME / ATLAS_PASSWORD secrets are not set — skipping the portal review."
            exit 0
          fi
          node portal-review.js

      - name: Upload review summary (non-sensitive)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bid-review-summary
          path: tools/out/**/review-summary.json
          retention-days: 90
          if-no-files-found: ignore
